# 用 GitHub 托管的临时环境定时跑脚本，不是自租云服务器。
# 提前约 20 分钟开工，邮件可能略早于目标点送达（可接受）。
# UTC 23:40 = 北京 07:40（目标约 08:00）；UTC 10:40 = 北京 18:40（目标约 19:00）。
name: Daily News Email

on:
  schedule:
    - cron: "40 23 * * *"
    - cron: "40 10 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily news
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python daily_news.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload briefing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
          if-no-files-found: ignore
          retention-days: 14
