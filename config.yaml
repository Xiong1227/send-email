# RSS 新闻源列表（按领域覆盖）
rss_feeds:
  # 国内科技
  - https://www.ithome.com/rss/
  - https://36kr.com/feed
  # 国际综合
  - https://feeds.bbci.co.uk/news/rss.xml
  - https://rss.nytimes.com/services/xml/rss/nyt/World.xml
  # 国际科技
  - https://techcrunch.com/feed/
  - https://feeds.arstechnica.com/arstechnica/index
  # 财经
  - https://www.cnbc.com/id/100003114/device/rss/rss.html
  - http://www.ftchinese.com/rss/feed

# 每次最多抓取的文章数量
max_articles: 5

# LLM 厂商切换（密钥见 .env）
# 改 provider 即可换厂商：agnes | deepseek
llm:
  provider: agnes
  providers:
    agnes:
      model: "agnes-2.5-flash"
      base_url: "https://apihub.agnes-ai.com/v1"
      api_key_env: "AGNES_API_KEY"
    deepseek:
      model: "deepseek-chat"
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"

# 邮件非敏感配置（账号/密码见 .env）
email:
  subject: "📰 每日新闻简报"

# 简报筛选与时效
# weight_keywords 不是搜索过滤器：源里的新闻仍会全部抓取并进入快讯。
# 这些词只给标题加分，命中的更容易出现在「30秒速览」和「深度精选」。
# 想更关注某类话题，把词换成自己的即可，例如：房价、新能源、半导体。
briefing:
  fresh_hours: 12
  min_fresh_articles: 5
  weight_keywords:
    - 突破
    - 首次
    - 历史新高
    - 首发
    - 制裁
    - 关税
    - 加息
    - 降息
    - 裁员
    - 收购
    - 上市
    - 暴跌
    - 暴涨
    - 监管
    - 芯片
    - AI

# 定时说明（实际由 Windows 任务计划程序 / GitHub Actions 控制）
schedule:
  note: "DailyNewsEmail @ 08:00 & 18:00"
